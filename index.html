DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LucasHost - Dashboard</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #0a0e1a; color: white; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; margin: 0; padding: 20px 0; }

  .card { background: #1e293b; padding: 2rem; border-radius: 16px; width: 320px; }
  h2 { text-align: center; color: #38bdf8; margin-top: 0; }
  .field { position: relative; margin: 6px 0; }
  input { width: 100%; padding: 10px; border-radius: 8px; border: none; font-size: 1rem; }
  .field.password input { padding-right: 40px; }
  .toggle-eye { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #64748b; font-size: 0.85rem; user-select: none; }
  .error-text { color: #f87171; font-size: 0.8rem; margin: 2px 0 0 4px; min-height: 14px; display: block; }
  button { width: 100%; padding: 10px; background: #38bdf8; color: #0f172a; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; font-size: 1rem; }
  button:hover:not(:disabled) { background: #0ea5e9; }
  button:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }
  #message { text-align: center; margin-top: 12px; min-height: 18px; font-size: 0.9rem; }
  .toggle { text-align: center; margin-top: 15px; cursor: pointer; color: #94a3b8; font-size: 0.9rem; }
  .toggle span { color: #38bdf8; text-decoration: underline; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #0f172a; border-top-color: transparent; border-radius: 50%; animation: spin 0.7s linear infinite; margin-right: 6px; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #dashboardCard {
    width: 340px;
    border-radius: 20px;
    padding: 0;
    overflow: hidden;
    background: linear-gradient(160deg, #0f2044 0%, #0a1630 60%, #0a0e1a 100%);
    box-shadow: 0 10px 40px rgba(56, 189, 248, 0.15);
    position: relative;
  }
  .dash-header {
    padding: 24px 24px 16px 24px;
    position: relative;
  }
  .dash-header::after {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 140px; height: 140px;
    background: radial-gradient(circle, rgba(56,189,248,0.25) 0%, transparent 70%);
    border-radius: 50%;
  }
  .greet-row { display: flex; justify-content: space-between; align-items: flex-start; }
  .greet-text { font-size: 0.95rem; color: #cbd5e1; }
  .greet-name { display: block; font-size: 1.3rem; font-weight: bold; color: #38bdf8; margin-top: 2px; }
  .sub-text { font-size: 0.8rem; color: #64748b; margin-top: 6px; }
  .avatar {
    width: 44px; height: 44px; border-radius: 50%;
    background: linear-gradient(135deg, #38bdf8, #2563eb);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem; flex-shrink: 0;
  }

  .services-panel {
    background: #0d1526;
    margin: 0 16px 16px 16px;
    border-radius: 14px;
    padding: 16px;
  }
  .panel-title { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; font-weight: bold; letter-spacing: 0.5px; color: #e2e8f0; margin-bottom: 12px; }
  .panel-title .dot-icon { width: 10px; height: 10px; background: #38bdf8; border-radius: 3px; display: inline-block; }

  .service-item {
    display: flex; align-items: center; gap: 12px;
    background: #111c33; border: 1px solid #1e293b;
    padding: 12px; border-radius: 12px; margin-bottom: 10px;
  }
  .service-icon {
    width: 40px; height: 40px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.2rem; flex-shrink: 0; color: white;
  }
  .icon-domain { background: linear-gradient(135deg, #34d399, #059669); }
  .icon-hosting { background: linear-gradient(135deg, #a78bfa, #7c3aed); }
  .icon-deploy { background: linear-gradient(135deg, #fb923c, #ea580c); }

  .service-info { flex: 1; min-width: 0; }
  .service-name { font-weight: bold; font-size: 0.95rem; }
  .service-desc { font-size: 0.75rem; color: #94a3b8; margin-top: 2px; }
  .status-badge {
    background: rgba(255,255,255,0.08); color: #cbd5e1;
    padding: 4px 10px; border-radius: 20px; font-size: 0.7rem;
    white-space: nowrap; display: flex; align-items: center; gap: 4px;
  }
  .chevron { color: #475569; font-size: 1.1rem; margin-left: 4px; }

  .logout-btn {
    margin: 0 16px 16px 16px;
    width: calc(100% - 32px);
    background: linear-gradient(90deg, #2563eb, #38bdf8);
    padding: 12px; border-radius: 12px; font-weight: bold;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .logout-btn:hover { opacity: 0.9; background: linear-gradient(90deg, #2563eb, #38bdf8); }
</style>
</head>
<body>

  <div class="card" id="authCard">
    <h2 id="formTitle">Karibu LucasHost</h2>

    <div class="field" id="fullNameField" style="display:none;">
      <input type="text" id="fullName" placeholder="Jina lako">
      <span class="error-text" id="fullNameError"></span>
    </div>

    <div class="field">
      <input type="email" id="email" placeholder="Email">
      <span class="error-text" id="emailError"></span>
    </div>

    <div class="field password">
      <input type="password" id="password" placeholder="Password">
      <span class="toggle-eye" id="toggleEye" onclick="togglePasswordView()">Onyesha</span>
      <span class="error-text" id="passwordError"></span>
    </div>

    <button id="submitBtn" onclick="submitForm()">Endelea</button>
    <p id="message"></p>
    <p class="toggle" onclick="toggleMode()">Bofya hapa: <span id="toggleText">Nina akaunti tayari (Ingia)</span></p>
  </div>

  <div class="card" id="dashboardCard" style="display:none;">
    <div class="dash-header">
      <div class="greet-row">
        <div>
          <span class="greet-text">Karibu,</span>
          <span class="greet-name" id="userName">👋</span>
          <div class="sub-text">Tumia huduma zetu kwa urahisi na ufanisi</div>
        </div>
        <div class="avatar">👤</div>
      </div>
    </div>

    <div class="services-panel">
      <div class="panel-title"><span class="dot-icon"></span> HUDUMA ZETU</div>
      <div id="servicesList">Inapakia huduma...</div>
    </div>

    <button class="logout-btn" onclick="logout()">➜ Toka (Logout)</button>
  </div><script>
  const API_URL = "https://lucashost-backend.onrender.com";
  let isSignup = true;
  let passwordVisible = false;

  const ICONS = {
    'Domain Registration': { icon: '🌐', cls: 'icon-domain', desc: 'Sajili domain yako kwa haraka na kwa usalama.' },
    'App Hosting': { icon: '🖥️', cls: 'icon-hosting', desc: 'Fikia programu zako mtandaoni kwa ufanisi.' },
    'Auto Deployment': { icon: '☁️', cls: 'icon-deploy', desc: 'Pakia na dhibiti programu zako moja kwa moja.' }
  };

  window.addEventListener('DOMContentLoaded', () => {
    const savedUser = localStorage.getItem('lucashost_user');
    if (savedUser) {
      showDashboard(savedUser);
    }
  });

  function toggleMode() {
    isSignup = !isSignup;
    document.getElementById('fullNameField').style.display = isSignup ? 'block' : 'none';
    document.getElementById('formTitle').innerText = isSignup ? 'Karibu LucasHost' : 'Ingia LucasHost';
    document.getElementById('toggleText').innerText = isSignup ? 'Nina akaunti tayari (Ingia)' : 'Sina akaunti (Jisajili)';
    clearErrors();
  }

  function togglePasswordView() {
    passwordVisible = !passwordVisible;
    document.getElementById('password').type = passwordVisible ? 'text' : 'password';
    document.getElementById('toggleEye').innerText = passwordVisible ? 'Ficha' : 'Onyesha';
  }

  function clearErrors() {
    document.getElementById('emailError').innerText = '';
    document.getElementById('passwordError').innerText = '';
    document.getElementById('fullNameError').innerText = '';
    document.getElementById('message').innerText = '';
  }

  function isValidEmail(email) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  }

  function validateForm(email, password, fullName) {
    let valid = true;
    clearErrors();

    if (!email) {
      document.getElementById('emailError').innerText = 'Weka email yako';
      valid = false;
    } else if (!isValidEmail(email)) {
      document.getElementById('emailError').innerText = 'Email si sahihi';
      valid = false;
    }

    if (!password) {
      document.getElementById('passwordError').innerText = 'Weka password';
      valid = false;
    } else if (password.length < 6) {
      document.getElementById('passwordError').innerText = 'Password iwe na herufi 6+';
      valid = false;
    }

    if (isSignup && !fullName) {
      document.getElementById('fullNameError').innerText = 'Weka jina lako';
      valid = false;
    }

    return valid;
  }

  async function submitForm() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const fullName = document.getElementById('fullName').value.trim();
    const messageEl = document.getElementById('message');
    const submitBtn = document.getElementById('submitBtn');

    if (!validateForm(email, password, fullName)) return;

    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner"></span> Inasindika...';
    messageEl.style.color = '#94a3b8';
    messageEl.innerText = '';

    const endpoint = isSignup ? '/api/signup' : '/api/login';
    const body = isSignup ? { email, password, full_name: fullName } : { email, password };

    try {
      const res = await fetch(API_URL + endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json();

      if (res.ok) {
        messageEl.style.color = '#4ade80';
        messageEl.innerText = data.message;

        if (!isSignup) {
          const name = (data.user && data.user.user_metadata && data.user.user_metadata.full_name) || email;
          localStorage.setItem('lucashost_user', name);
          setTimeout(() => showDashboard(name), 500);
        } else {
          setTimeout(() => {
            toggleMode();
            document.getElementById('email').value = email;
          }, 1200);
        }
      } else {
        messageEl.style.color = '#f87171';
        messageEl.innerText = data.error || 'Kuna tatizo limejitokeza';
      }
    } catch (err) {
      messageEl.style.color = '#f87171';
      messageEl.innerText = 'Imeshindikana kuunganisha na server';
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerText = 'Endelea';
    }
  }

  function showDashboard(name) {
    document.getElementById('authCard').style.display = 'none';
    document.getElementById('dashboardCard').style.display = 'block';
    document.getElementById('userName').innerText = name + ' 👋';
    loadServices();
  }

  function logout() {
    localStorage.removeItem('lucashost_user');
    document.getElementById('dashboardCard').style.display = 'none';
    document.getElementById('authCard').style.display = 'block';
    document.getElementById('email').value = '';
    document.getElementById('password').value = '';
    clearErrors();
  }

  async function loadServices() {
    const listEl = document.getElementById('servicesList');
    listEl.innerText = 'Inapakia huduma...';
    try {
      const res = await fetch(API_URL + '/api/services');
      const data = await res.json();
      listEl.innerHTML = '';
      data.services.forEach(service => {
        const meta = ICONS[service.name] || { icon: '⚙️', cls: 'icon-domain', desc: '' };
        const item = document.createElement('div');
        item.className = 'service-item';
        item.innerHTML = `
          <div class="service-icon ${meta.cls}">${meta.icon}</div>
          <div class="service-info">
            <div class="service-name">${service.name}</div>
            <div class="service-desc">${meta.desc}</div>
          </div>
          <div class="status-badge">⏱ ${service.status}</div>
          <div class="chevron">›</div>
        `;
        listEl.appendChild(item);
      });
    } catch (err) {
      listEl.innerText = 'Imeshindikana kupakia huduma. Jaribu tena baadaye.';
    }
  }
</script>

</body>
</html>
